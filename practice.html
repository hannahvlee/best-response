<style>
  :root {
    --bg: #f9f9f8;
    --bg2: #ffffff;

    --border: #ebebeb;
    --blue: #4a80d4;    --blue-bg: #f3f7fe;
    --teal: #3aada3;    --teal-bg: #f2fbf9;
    --purple: #9a72dc;  --purple-bg: #f7f4fe;
    --amber: #c89440;   --amber-bg: #fdf8ee;
    --coral: #d96b50;   --coral-bg: #fdf4f2;
    --pink: #d4639a;    --pink-bg: #fdf2f7;
    --gray: #909090;    --gray-bg: #f5f5f5;
    --green: #3a9a6a;   --green-bg: #f0faf4;
    --red: #c0392b;     --red-bg: #fdf3f2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pretendard', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.7;
  }

  header {
    background: var(--text);
    color: white;
    padding: 1.25rem 2rem 1.25rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.875rem;
  }

  /* 필터 영역 */
  .filters {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .filter-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-label {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.4);
    min-width: 60px;
    font-family: monospace;
  }

  .filter-btn {
    font-family: 'Pretendard', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn:hover { border-color: rgba(255,255,255,0.5); color: white; }

  .filter-btn.active {
    background: white;
    color: var(--text);
    border-color: white;
  }

  .filter-btn.all-btn.active {
    background: rgba(255,255,255,0.15);
    color: white;
    border-color: rgba(255,255,255,0.4);
  }

  /* 결과 카운트 */
  .result-bar {
    max-width: 720px;
    margin: 1.5rem auto 0.75rem;
    padding: 0 1rem;
    font-size: 0.78rem;
    color: var(--text3);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .active-filters {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .active-tag {
    font-size: 0.7rem;
    padding: 1px 8px;
    border-radius: 20px;
    background: var(--text);
    color: white;
  }

  /* 카드 컨테이너 */
  .cards {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 1rem 3rem;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* 문제 카드 */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .card-header {
    padding: 0.875rem 1.125rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .card-question-inline {
    flex: 1;
    font-size: 0.92rem;
    font-weight: 500;
    line-height: 1.55;
    color: var(--text);
  }

  .card-num {
    font-family: monospace;
    font-size: 0.72rem;
    color: var(--text3);
    min-width: 28px;
  }

  .qtype-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.72rem;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .qtype-num {
    font-family: monospace;
    font-size: 0.68rem;
    padding: 1px 5px;
    border-radius: 4px;
  }



  /* 선지 */
  .choices { padding: 0.5rem 0; }

  .choice {
    padding: 0.6rem 1.125rem;
    display: flex;
    flex-direction: column;
    gap: 4px;
    border-bottom: 1px solid var(--border);
  }

  .choice:last-child { border-bottom: none; }

  .choice-row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    justify-content: space-between;
  }

  .choice-marker {
    font-size: 0.75rem;
    min-width: 16px;
    margin-top: 2px;
  }

  .choice-text {
    font-size: 0.85rem;
    line-height: 1.55;
    color: var(--text2);
  }

  .choice.correct .choice-text {
    color: var(--text);
    font-weight: 500;
  }

  .choice-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding-left: 0;
  }

  .tag {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 500;
    padding: 1px 7px;
    border-radius: 20px;
  }

  /* 정답 태그 */
  .tag-answer {
    background: var(--green-bg);
    color: var(--green);
    border: 1px solid #c3e8d4;
  }

  /* 오답 함정 태그 색상 */
  .tag-a, .tag-b, .tag-c, .tag-d, .tag-e, .tag-f {
    background: var(--gray-bg);
    color: var(--gray);
    border: 1px solid var(--border);
  }

  /* 질문 유형별 색상 */
  .qt-1 { color: var(--blue); }
  .qt-1 .qtype-num { background: var(--blue-bg); color: var(--blue); }
  .qt-2 { color: var(--teal); }
  .qt-2 .qtype-num { background: var(--teal-bg); color: var(--teal); }
  .qt-3 { color: var(--purple); }
  .qt-3 .qtype-num { background: var(--purple-bg); color: var(--purple); }
  .qt-4 { color: var(--amber); }
  .qt-4 .qtype-num { background: var(--amber-bg); color: var(--amber); }
  .qt-5 { color: var(--coral); }
  .qt-5 .qtype-num { background: var(--coral-bg); color: var(--coral); }
  .qt-6 { color: var(--pink); }
  .qt-6 .qtype-num { background: var(--pink-bg); color: var(--pink); }
  .qt-기 { color: var(--gray); }
  .qt-기 .qtype-num { background: var(--gray-bg); color: var(--gray); }

  .hidden { display: none !important; }

  .no-result {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text3);
    font-size: 0.85rem;
  }

  .back-btn {
    font-family: 'Pretendard', sans-serif;
    font-size: 0.72rem;
    color: rgba(255,255,255,0.35);
    text-decoration: none;
    display: inline-block;
    margin-bottom: 0.4rem;
    transition: color 0.2s;
  }
  .back-btn:hover { color: rgba(255,255,255,0.7); }
</style>

  }
];

const state = { qtype: 'all', answer: 'all', trap: 'all', test: 'all' };

function getAnswerCommonCode(q) {
  for (const c of q.choices) {
    if (c.correct) return c.answerCode;
  }
  return null;
}

function getTrapCodes(q) {
  const codes = new Set();
  for (const c of q.choices) {
    if (!c.correct && c.traps) {
      for (const t of c.traps) codes.add(t.code);
    }
  }
  return codes;
}

function buildCard(q) {
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.qtype = q.qtypeCode;
  div.dataset.answer = getAnswerCommonCode(q) || '';
  div.dataset.traps = [...getTrapCodes(q)].join(',');

  const qtClass = `qt-${q.qtypeCode}`;

  let choicesHtml = '';
  const labels = ['a', 'b', 'c', 'd'];
  q.choices.forEach((c, i) => {
    const marker = c.correct ? '✅' : '❌';
    let tagsHtml = '';
    if (c.correct) {
      tagsHtml = `<span class="tag tag-answer">${c.answerCode} ${c.answerName} (${c.answerDetail})</span>`;
    } else if (c.traps && c.traps.length > 0) {
      tagsHtml = c.traps.map(t => `<span class="tag tag-${t.code}">${t.code} ${t.name}${t.desc ? ' — ' + t.desc : ''}</span>`).join('');
    }
    choicesHtml += `
      <div class="choice ${c.correct ? 'correct' : ''}">
        <div class="choice-row">
          <span class="choice-text">${labels[i]}. ${c.text}</span>
          <span class="choice-marker">${marker}</span>
        </div>
        ${tagsHtml ? `<div class="choice-tags">${tagsHtml}</div>` : ''}
      </div>`;
  });

  div.innerHTML = `
    <div class="card-header">
      <span class="card-num">${q.num}.</span>
      <span class="card-question-inline">${q.question}</span>
      <span class="qtype-tag ${qtClass}">
        <span class="qtype-num">${q.qtypeCode}</span>${q.qtypeName}
      </span>
    </div>
    <div class="choices">${choicesHtml}</div>
  `;
  return div;
}

function render() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  let count = 0;

  // 현재 필터 모드 결정
  let filterMode = 'all';
  let filterValue = 'all';
  if (state.answer !== 'all') { filterMode = 'answer'; filterValue = state.answer; }
  if (state.trap !== 'all') { filterMode = 'trap'; filterValue = state.trap; }

  QUESTIONS.forEach(q => {
    const answerCode = getAnswerCommonCode(q) || '';
    const trapCodes = getTrapCodes(q);

    const qtOk = state.qtype === 'all' || q.qtypeCode === state.qtype;
    const ansOk = state.answer === 'all' || answerCode === state.answer;
    const trapOk = state.trap === 'all' || trapCodes.has(state.trap);
    const testOk = state.test === 'all' || (q.num >= TEST_RANGES[state.test][0] && q.num <= TEST_RANGES[state.test][1]);

    if (qtOk && ansOk && trapOk && testOk) {
      container.appendChild(buildCard(q, filterMode, filterValue));
      count++;
    }
  });

  if (count === 0) {
    container.innerHTML = '<div class="no-result">해당하는 문제가 없어요.</div>';
  }

  document.getElementById('result-count').textContent = `${count}문제`;

  // 활성 필터 표시
  const af = document.getElementById('active-filters');
  af.innerHTML = '';
  if (state.test !== 'all') af.innerHTML += `<span class="active-tag">Test ${state.test}</span>`;
  if (state.qtype !== 'all') af.innerHTML += `<span class="active-tag">유형 ${state.qtype}</span>`;
  if (state.answer !== 'all') af.innerHTML += `<span class="active-tag">${state.answer}</span>`;
  if (state.trap !== 'all') af.innerHTML += `<span class="active-tag">${state.trap}</span>`;
}

// 필터 버튼 이벤트
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const filter = btn.dataset.filter;
    const value = btn.dataset.value;

    // 이미 활성화된 버튼 다시 클릭하면 전체로 해제
    if (btn.classList.contains('active') && value !== 'all') {
      document.querySelectorAll(`[data-filter="${filter}"]`).forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-filter="${filter}"][data-value="all"]`).classList.add('active');
      state[filter] = 'all';
    } else {
      document.querySelectorAll(`[data-filter="${filter}"]`).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state[filter] = value;
    }
    render();
  });
});

render();
</script>
</body>
</html>
